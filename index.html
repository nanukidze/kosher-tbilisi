  seal:"Проверьте печать",dairy:"Молочное",meat:"Мясное",parve:"Парве",hs:"халав стам",hn:"халав нохри",shop:"Продаётся в Бейт Хабаде",src:"Источник",srcNames:{"Хабад":"Хабад","Olami":"Olami","Московский раввинский суд":"Московский раввинский суд"},
  rules:`<h2>Как читать пометки</h2><dl><dt>Проверьте печать</dt><dd>Продукт кошерный только с указанным знаком кашрута на упаковке. Без знака — не покупать.</dd><dt>Молочное, мясное, парве</dt><dd>Указано только там, где это написано в источнике. «Халав стам» — обычное молоко без надзора халав Исраэль; пометка стоит там, где источник это указывает.</dd><dt>Продаётся в Бейт Хабаде</dt><dd>Можно купить в Бейт Хабаде Тбилиси: ул. Бамбис Риги, 7. Вопросы: +995 551 009 655.</dd></dl>`,
  foot:`Источники: <a href="https://chabadtbilisi.ge/en/food/57/" target="_blank" rel="noopener">Хабад Тбилиси</a> и <a href="https://olami.ge/kosher_in_georgia" target="_blank" rel="noopener">Olami Georgia</a>, <a href="https://kasher.ru/index.php?Itemid=62&amp;catid=39%3A2011-07-11-16-17-07&amp;id=64%3A2011-07-11-17-17-33&amp;option=com_content&amp;view=article" target="_blank" rel="noopener">Московский раввинский суд</a>. Списки меняются — при сомнениях уточняйте у раввина.`},
 en:{title:"Kosher products in Georgia",lede:"The Chabad Tbilisi, Olami and Moscow Rabbinical Court lists in one place. Start typing a product or brand name — in English or Russian.",ph:"e.g. mayonnaise, Sloboda, tea",qLabel:"Search products",clear:"Clear search",cats:"Categories",all:"All",
  c:{drinks:"Drinks",alcohol:"Alcohol and wine",hot:"Tea and coffee",oil:"Oil",fish:"Fish",canned:"Canned food and pickles",sauces:"Sauces and jams",dry:"Pasta, grains, dry goods",cereal:"Cereals",sweets:"Sweets and ice cream",plant:"Plant-based milk",dairy:"Dairy",meat:"Meat",general:"Frozen, dried fruit, nuts"},
  fChabad:"Sold at Chabad House",fNoSeal:"No symbol check needed",found:"Found",
  emptyT:"Nothing found",emptyD:"This product isn't on the lists. Try another word or the brand name — or ask at the Chabad House.",
  seal:"Check for symbol",dairy:"Dairy",meat:"Meat",parve:"Parve",hs:"chalav stam",hn:"chalav nochri",shop:"Sold at Chabad House",src:"Source",srcNames:{"Хабад":"Chabad","Olami":"Olami","Московский раввинский суд":"Moscow Rabbinical Court"},
  rules:`<h2>What the labels mean</h2><dl><dt>Check for symbol</dt><dd>The product is kosher only with the stated kashrut symbol on the package. No symbol — don't buy.</dd><dt>Dairy, meat, parve</dt><dd>Shown only where the source says so. "Chalav stam" means regular milk without chalav Yisrael supervision; it is marked where the source states it.</dd><dt>Sold at Chabad House</dt><dd>Available at Chabad House Tbilisi: 7 Bambis Rigi St. Questions: +995 551 009 655.</dd></dl>`,
  foot:`Sources: <a href="https://chabadtbilisi.ge/en/food/57/" target="_blank" rel="noopener">Chabad of Tbilisi</a>, <a href="https://olami.ge/kosher_in_georgia" target="_blank" rel="noopener">Olami Georgia</a> and <a href="https://kasher.ru/index.php?Itemid=62&amp;catid=39%3A2011-07-11-16-17-07&amp;id=64%3A2011-07-11-17-17-33&amp;option=com_content&amp;view=article" target="_blank" rel="noopener">Moscow Rabbinical Court</a>. Lists change — when in doubt, ask a rabbi.`}
};
const SEAL_EN = {"любой знак кашрута":"any kashrut symbol","обязательно указание кашрута":"kashrut must be stated"};
SEAL_EN[GRR]="Chief Rabbinate of Russia";
P.forEach((p,i)=>{ const e=EN[i]||{};
  p.en={n:e.n||p.n,b:e.b||p.b,d:e.d!==undefined?e.d:p.d,w:e.w!==undefined?e.w:p.warn,se:e.se||(p.seal?(SEAL_EN[p.seal]||p.seal):undefined)};
});
if(EN.length!==P.length) console.warn("EN length mismatch",EN.length,P.length);

const STC = {dairy:"t-dairy",meat:"t-meat",parve:"t-parve"};
let lang="ru";
try{ const sv=localStorage.getItem("kosher-lang"); if(sv==="en"||sv==="ru") lang=sv; }catch(e){}
let cat = "all", fChabad = false, fNoSeal = false;
const $ = id => document.getElementById(id);
const norm = s => (s||"").toLowerCase().replace(/ё/g,"е").replace(/<[^>]+>/g," ");
const esc = s => s.replace(/[&<>"]/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));
P.forEach(p => p.hay = norm([p.n,p.b,p.d,p.k,p.warn,p.seal,p.en.n,p.en.b,p.en.d,p.en.w,p.en.se].join(" ")));

/* ---- fuzzy search: transliteration + phonetic skeleton + typo tolerance ---- */
const CYR = {а:"a",б:"b",в:"v",г:"g",д:"d",е:"e",ж:"zh",з:"z",и:"i",й:"i",к:"k",л:"l",м:"m",н:"n",о:"o",п:"p",р:"r",с:"s",т:"t",у:"u",ф:"f",х:"h",ц:"ts",ч:"ch",ш:"sh",щ:"sh",ъ:"",ы:"i",ь:"",э:"e",ю:"iu",я:"ia"};
function skel(s){
  s = norm(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  s = s.replace(/[а-я]/g,ch=>CYR[ch]??ch);
  s = s.replace(/[^a-z0-9\s]/g,"")
       .replace(/kh/g,"h").replace(/ph/g,"f").replace(/ck/g,"k").replace(/q/g,"k")
       .replace(/w/g,"v").replace(/x/g,"ks").replace(/[yj]/g,"i").replace(/c/g,"k")
       .replace(/(.)\1+/g,"$1");
  return s;
}
function osa(a,b,max){
  const m=a.length,n=b.length; if(Math.abs(m-n)>max) return max+1;
  let pp=null,p=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){
    const c=[i]; let best=i;
    for(let j=1;j<=n;j++){
      let v=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));
      if(pp&&i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1]) v=Math.min(v,pp[j-2]+1);
      c[j]=v; if(v<best) best=v;
    }
    if(best>max) return max+1;
    pp=p; p=c;
  }
  return p[n];
}
P.forEach(p => {
  p.sk = skel(p.hay);
  p.tok = [...new Set(p.sk.split(/\s+/).filter(Boolean))];
});
function wordScore(p, w){
  if(p.hay.includes(w)) return 3;
  const s = skel(w); if(!s) return 3;
  if(p.sk.includes(s)) return 2.5;
  const L = s.length; if(L<4) return 0;
  const max = L<=6 ? 1 : 2;
  let best = max+1;
  for(const t of p.tok){
    if(t.length < L-max) continue;
    for(const len of [L-1,L,L+1]){
      if(len<1||len>t.length) continue;
      const d = osa(s,t.slice(0,len),max); if(d<best) best=d;
      if(best===0) break;
    }
    if(t.length>L+1){ const d=osa(s,t,max); if(d<best) best=d; }
    if(best===0) break;
  }
  return best<=max ? 2 - best*0.5 : 0;
}
function score(p, words){
  let total=0;
  for(const w of words){ const s=wordScore(p,w); if(!s) return 0; total+=s; }
  return total;
}

function hl(text, q){
  if(!q) return esc(text);
  const t = esc(text), nt = norm(t);
  const i = nt.indexOf(q);
  if(i<0) return t;
  return t.slice(0,i)+"<mark>"+t.slice(i,i+q.length)+"</mark>"+t.slice(i+q.length);
}
function view(p){ return lang==="en" ? {n:p.en.n,b:p.en.b,d:p.en.d,w:p.en.w,se:p.en.se} : {n:p.n,b:p.b,d:p.d,w:p.warn,se:p.seal}; }

function applyLang(){
  const t=T[lang];
  document.documentElement.lang=lang;
  document.title=t.title;
  $("t-title").textContent=t.title; $("t-lede").textContent=t.lede;
  $("q").placeholder=t.ph; $("q").setAttribute("aria-label",t.qLabel);
  $("clear").setAttribute("aria-label",t.clear);
  $("chips").setAttribute("aria-label",t.cats);
  $("fChabad").textContent=t.fChabad; $("fNoSeal").textContent=t.fNoSeal;
  $("t-rules").innerHTML=t.rules; $("t-foot").innerHTML=t.foot;
  document.querySelectorAll(".lang").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===lang));
  renderChips(); render();
}

function renderChips(){
  const t=T[lang];
  const all = [["all",t.all],...CATS.map(id=>[id,t.c[id]])];
  $("chips").innerHTML = all.map(([id,l])=>`<button class="chip" data-c="${id}" aria-pressed="${cat===id}">${l}</button>`).join("");
}

function render(){
  const t=T[lang];
  const q = norm($("q").value.trim());
  $("clear").classList.toggle("show", !!q);
  const words = q.split(/\s+/).filter(Boolean);
  const res = P.filter(p =>
    (cat==="all"||p.c===cat) &&
    (!fChabad||p.shop) && (!fNoSeal||!p.seal) &&
    (!words.length || (p._s = score(p,words)) > 0));
  if(words.length){
    const exact = res.filter(p=>p._s >= 2.5*words.length);
    if(exact.length){ res.length=0; res.push(...exact); }
    res.sort((a,b)=>b._s-a._s);
  }
  $("count").textContent = res.length ? `${t.found}: ${res.length}` : "";
  if(!res.length){
    $("list").innerHTML = `<div class="empty"><strong>${t.emptyT}</strong>${t.emptyD}</div>`;
    return;
  }
  const first = words[0]||"";
  $("list").innerHTML = CATS.map(id=>{
    const items = res.filter(p=>p.c===id);
    if(!items.length) return "";
    return `<section class="group" id="g-${id}"><h2>${t.c[id]} <span>${items.length}</span></h2><ul class="items">${items.map(p=>{
      const v=view(p), tags = [];
      if(v.se) tags.push(`<span class="tag t-seal">${t.seal}: ${esc(v.se)}</span>`);
      if(v.w) tags.push(`<span class="tag t-warn">${esc(v.w)}</span>`);
      if(p.st) tags.push(`<span class="tag ${STC[p.st]}">${t[p.st]}${p.hs?` (${t.hs})`:p.hn?` (${t.hn})`:""}</span>`);
      if(p.shop) tags.push(`<span class="tag t-chabad">${t.shop}</span>`);
      return `<li><p class="name">${hl(v.n,first)}${v.b?` <span class="brand">· ${hl(v.b,first)}</span>`:""}</p>${v.d?`<p class="details">${v.d}</p>`:""}${tags.length?`<div class="tags">${tags.join("")}</div>`:""}<div class="src">${t.src}: ${p.s.map(x=>`<a href="${srcUrl(x,p)}" target="_blank" rel="noopener">${t.srcNames[x]||x}</a>`).join(", ")}</div></li>`;
    }).join("")}</ul></section>`;
  }).join("");
}

document.querySelector(".langs").addEventListener("click",e=>{
  const b=e.target.closest(".lang"); if(!b) return;
  lang=b.dataset.l; try{localStorage.setItem("kosher-lang",lang);}catch(err){}
  applyLang();
});
$("chips").addEventListener("click",e=>{
  const b = e.target.closest(".chip"); if(!b) return;
  cat = b.dataset.c; renderChips(); render();
});
$("q").addEventListener("input",render);
$("clear").addEventListener("click",()=>{$("q").value="";render();$("q").focus();});
$("fChabad").addEventListener("click",e=>{fChabad=!fChabad;e.currentTarget.setAttribute("aria-pressed",fChabad);render();});
$("fNoSeal").addEventListener("click",e=>{fNoSeal=!fNoSeal;e.currentTarget.setAttribute("aria-pressed",fNoSeal);render();});
applyLang();
</script>
</body>
</html>
